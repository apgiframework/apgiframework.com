name: Verify production

# Read-only acceptance check of the live site: security headers, held pages
# return 404, sitemap and canonical hosts agree, every internal link resolves.
# Needs no secrets. Runs daily and on demand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  verify:
    name: Verify https://www.apgiframework.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run site verification against production
        run: python3 scripts/verify_site.py https://www.apgiframework.com
