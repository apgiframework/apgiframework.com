<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thalamocortical Conscious Ignition Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Deep dark background */
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #eee;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        .clock-container {
            border-left: 4px solid #00ffcc;
            padding-left: 15px;
            margin-bottom: 20px;
        }

        #time-display {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00ffcc;
        }

        #phase-label {
            font-size: 1.2rem;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        #details-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 80%;
            pointer-events: none;
        }

        #active-event {
            font-size: 1.5rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border: 1px solid #333;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Legend */
        #legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 1px solid #333;
            font-size: 0.8rem;
            pointer-events: none;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="neuralCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="clock-container">
            <div id="time-display">000 ms</div>
            <div id="phase-label">Resting State</div>
        </div>
    </div>

    <div id="legend">
        <div class="legend-item"><div class="dot" style="background:#3498db; box-shadow:0 0 5px #3498db;"></div>Frontal (L5 Pyr)</div>
        <div class="legend-item"><div class="dot" style="background:#2ecc71; box-shadow:0 0 5px #2ecc71;"></div>Parietal</div>
        <div class="legend-item"><div class="dot" style="background:#9b59b6; box-shadow:0 0 5px #9b59b6;"></div>Thalamus</div>
        <div class="legend-item"><div class="dot" style="background:#f1c40f; box-shadow:0 0 5px #f1c40f;"></div>Insula</div>
        <div class="legend-item"><div class="dot" style="background:#ff0000; box-shadow:0 0 5px #ff0000;"></div>PV+ Interneuron</div>
        <div class="legend-item"><div class="dot" style="background:#00ffff; box-shadow:0 0 5px #00ffff;"></div>SOM+ Interneuron</div>
    </div>

    <div id="details-box">
        <div id="active-event">Initializing...</div>
    </div>
</div>

<script>
/**
 * THALAMOCORTICAL IGNITION ANIMATION
 * 
 * Technical Implementation:
 * - Canvas-based rendering loop.
 * - State machine logic driving the 'simulated time' (0-500ms).
 * - The simulation loop is slower than real-time to allow visual comprehension.
 */

const canvas = document.getElementById('neuralCanvas');
const ctx = canvas.getContext('2d');
const timeDisplay = document.getElementById('time-display');
const phaseLabel = document.getElementById('phase-label');
const activeEventLabel = document.getElementById('active-event');

// --- Configuration ---
let width, height;
const SIM_DURATION = 500; // ms
const SPEED_FACTOR = 0.25; // Speed of simulation (lower = slower visual)
let simTime = 0; // Current simulation time

// --- Anatomy Coordinates (Normalized 0-1) ---
const regions = {
    frontal: { x: 0.3, y: 0.3, color: '#3498db', label: 'Frontal' },
    parietal: { x: 0.7, y: 0.3, color: '#2ecc71', label: 'Parietal' },
    thalamus: { x: 0.5, y: 0.7, color: '#9b59b6', label: 'Thalamus' }, // Matrix/Pulvinar
    insula: { x: 0.5, y: 0.45, color: '#f1c40f', label: 'Insula' },
    temporal: { x: 0.75, y: 0.6, color: '#e67e22', label: 'Temporal' },
    hippocampus: { x: 0.6, y: 0.8, color: '#1abc9c', label: 'Hippo' }
};

// Helper to get screen coords
function getPos(regionKey) {
    return {
        x: regions[regionKey].x * width,
        y: regions[regionKey].y * height
    };
}

// --- Animation State Variables ---
let particles = []; // For signals traveling axons
let interneurons = []; // PV and SOM instances

// Setup Interneurons
function initInterneurons() {
    interneurons = [];
    // Create a cluster of PV and SOM around Frontal/Parietal
    ['frontal', 'parietal'].forEach(r => {
        const center = getPos(r);
        // PV+ (Fast)
        for(let i=0; i<5; i++) {
            interneurons.push({
                type: 'PV',
                region: r,
                offsetX: (Math.random() - 0.5) * 80,
                offsetY: (Math.random() - 0.5) * 80,
                state: 0
            });
        }
        // SOM+ (Slow)
        for(let i=0; i<5; i++) {
            interneurons.push({
                type: 'SOM',
                region: r,
                offsetX: (Math.random() - 0.5) * 100,
                offsetY: (Math.random() - 0.5) * 100,
                state: 0
            });
        }
    });
}

// --- Resizing ---
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    initInterneurons();
}
window.addEventListener('resize', resize);
resize();

// --- Drawing Helpers ---

function drawGlowLine(x1, y1, x2, y2, color, width, opacity) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.globalAlpha = opacity;
    ctx.shadowBlur = 15;
    ctx.shadowColor = color;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
}

function drawRegionNode(key, intensity = 1) {
    const pos = getPos(key);
    const r = regions[key];
    
    // Base Glow
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 15 + (5 * intensity), 0, Math.PI * 2);
    ctx.fillStyle = r.color;
    ctx.globalAlpha = 0.3 * intensity;
    ctx.shadowBlur = 20 * intensity;
    ctx.shadowColor = r.color;
    ctx.fill();
    
    // Core
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; // Soma core
    ctx.globalAlpha = 0.8;
    ctx.fill();
    
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.fillText(r.label, pos.x - 20, pos.y + 30);

    // If L5 Pyramidal (Frontal/Parietal), draw Schematic Morphology
    if (key === 'frontal' || key === 'parietal') {
        drawL5Morphology(pos.x, pos.y, intensity, key);
    }
    
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}

// Draws a schematic Layer 5 Pyramidal Neuron
function drawL5Morphology(bx, by, intensity, key) {
    // Apical dendrite reaches up (visually 'up' on screen)
    // In cortex L1 is usually surface, L5 deep. Let's draw Apical going UP.
    const apicalHeight = 60;
    
    // Apical Shaft
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx, by - apicalHeight);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Apical Tuft (L1)
    ctx.beginPath();
    ctx.arc(bx, by - apicalHeight, 5, 0, Math.PI*2); // L1 Target area
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fill();

    // Specific Effects based on simulation time
    
    // 0-50ms: Thalamus -> L1 connection (highlight tuft)
    if(simTime < 50) {
        ctx.shadowColor = '#9b59b6';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(bx, by - apicalHeight, 8, 0, Math.PI*2);
        ctx.fillStyle = '#9b59b6';
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // 50-100ms: Ca2+ Spike (Blue flow down apical)
    if(simTime > 50 && simTime < 100) {
        const progress = (simTime - 50) / 50;
        const spikeY = (by - apicalHeight) + (progress * apicalHeight);
        
        ctx.shadowColor = '#00ccff';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(bx, spikeY, 6, 0, Math.PI*2);
        ctx.fillStyle = '#00ccff';
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // 50-150ms: Somatic Bursting
    if(simTime > 60 && simTime < 150) {
        // Flicker logic for bursting
        if (Math.random() > 0.3) {
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.moveTo(bx, by - 10); // Triangle Soma
            ctx.lineTo(bx - 10, by + 10);
            ctx.lineTo(bx + 10, by + 10);
            ctx.closePath();
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
}

function updateUI(phase, details) {
    phaseLabel.innerText = phase;
    activeEventLabel.innerText = details;
    activeEventLabel.style.opacity = 1;
    timeDisplay.innerText = Math.floor(simTime).toString().padStart(3, '0') + ' ms';
}

// --- Main Render Loop ---

function animate() {
    // Clear Screen with trails
    ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; // Trail effect
    ctx.fillRect(0, 0, width, height);

    // Global Composite for glow
    ctx.globalCompositeOperation = 'lighter';

    // Update Time
    simTime += 16 * SPEED_FACTOR; // ~16ms per frame * factor
    if (simTime > 510) simTime = 0; // Reset loop with small buffer

    // --- Draw Static Connections (Dim Backbone) ---
    const wiring = [
        ['thalamus', 'frontal'], ['thalamus', 'parietal'], 
        ['frontal', 'parietal'], ['frontal', 'insula'], 
        ['parietal', 'insula'], ['parietal', 'temporal'],
        ['hippocampus', 'parietal']
    ];
    
    wiring.forEach(pair => {
        const p1 = getPos(pair[0]);
        const p2 = getPos(pair[1]);
        drawGlowLine(p1.x, p1.y, p2.x, p2.y, '#333', 1, 0.3);
    });

    // --- Phase Logic ---

    // Phase 1: 0-50ms - Initial Thalamic Drive
    if (simTime < 50) {
        updateUI("Thalamic Drive", "Matrix Thalamus Inputs -> Cortex L1");
        const tPos = getPos('thalamus');
        
        // Draw pulsing thalamus
        drawRegionNode('thalamus', 2);
        
        // Beams to Cortex L1 (Frontal/Parietal)
        ['frontal', 'parietal'].forEach(target => {
            const t = getPos(target);
            // Aim for "L1" (above the node)
            const l1Y = t.y - 60; 
            
            // Draw flowing particles
            if(Math.random() > 0.5) {
                ctx.beginPath();
                // Lerp based on time
                const prog = simTime / 50;
                const curX = tPos.x + (t.x - tPos.x) * prog;
                const curY = tPos.y + (l1Y - tPos.y) * prog;
                
                ctx.arc(curX, curY, 4, 0, Math.PI*2);
                ctx.fillStyle = '#9b59b6';
                ctx.fill();
            }
            drawGlowLine(tPos.x, tPos.y, t.x, l1Y, '#9b59b6', 2, 0.5);
        });
    }

    // Phase 2: 50-100ms - Apical Ca2+ & Burst
    else if (simTime < 100) {
        updateUI("Ignition", "L5 Apical Ca²⁺ Spike & PV+ Inhibition");
        drawRegionNode('frontal', 1.5);
        drawRegionNode('parietal', 1.5);
        drawRegionNode('thalamus', 0.5); // Thalamus dims

        // Interneurons: PV (Red Flash)
        interneurons.filter(n => n.type === 'PV').forEach(n => {
            const center = getPos(n.region);
            if(Math.random() > 0.7) { // Fast blinking
                ctx.beginPath();
                ctx.arc(center.x + n.offsetX, center.y + n.offsetY, 4, 0, Math.PI*2);
                ctx.fillStyle = '#ff0000';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        });
    }

    // Phase 3: 100-150ms - Local Gamma
    else if (simTime < 150) {
        updateUI("Gamma Initiation", "Local Gamma (30-80Hz) Microcolumns");
        
        // Rapid oscillation intensity
        const gamma = (Math.sin(simTime * 1.5) + 1) / 2; // fast wave
        drawRegionNode('frontal', 1 + gamma);
        drawRegionNode('parietal', 1 + gamma);
    }

    // Phase 4: 150-200ms - Long Range Sync (P3a)
    else if (simTime < 200) {
        updateUI("Broadcasting", "Global Workspace Entry (P3a)");
        
        // Connect Triangle: Frontal - Parietal - Insula
        const tri = ['frontal', 'parietal', 'insula'];
        
        // Draw Synchronized Triangle
        ctx.beginPath();
        const f = getPos('frontal');
        const p = getPos('parietal');
        const i = getPos('insula');
        
        ctx.moveTo(f.x, f.y);
        ctx.lineTo(p.x, p.y);
        ctx.lineTo(i.x, i.y);
        ctx.closePath();
        
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 20;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fill();
        ctx.shadowBlur = 0;

        drawRegionNode('insula', 2);
    }

    // Phase 5: 200-250ms - Attractor & Pupil
    else if (simTime < 250) {
        updateUI("Sustained State", "Attractor State & Pupil Dilation");
        
        // Pupil Effect (Background Circle)
        const dilation = (simTime - 200) / 50; // 0 to 1
        ctx.globalCompositeOperation = 'source-over';
        ctx.beginPath();
        ctx.arc(width/2, height/2, 100 + (dilation * 300), 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(50, 50, 50, 0.5)';
        ctx.lineWidth = 50;
        ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';

        // Full Network Glow
        ['frontal', 'parietal', 'insula'].forEach(k => drawRegionNode(k, 1.8));
        
        // TRN Pulse (From Thalamus outward)
        ctx.beginPath();
        ctx.arc(getPos('thalamus').x, getPos('thalamus').y, (simTime-200)*4, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(155, 89, 182, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Phase 6: 250-300ms - Peak Sync (P3b) & Temporal
    else if (simTime < 300) {
        updateUI("Conscious Access", "P3b Peak Synchrony & Temporal Integration");
        
        // Add Temporal to the glow
        drawRegionNode('temporal', 2);
        drawGlowLine(getPos('parietal').x, getPos('parietal').y, getPos('temporal').x, getPos('temporal').y, '#e67e22', 4, 0.8);

        // Parietal "Ignition" Pulse
        const p = getPos('parietal');
        ctx.beginPath();
        ctx.arc(p.x, p.y, 60, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(46, 204, 113, 0.3)';
        ctx.fill();
    }

    // Phase 7: 300-350ms - Encoding
    else if (simTime < 350) {
        updateUI("Encoding", "Hippocampal Ripples & Semantic Binding");
        drawRegionNode('hippocampus', 2);
        
        // Ripples (Sharp wave ripples visual)
        const h = getPos('hippocampus');
        ctx.beginPath();
        for(let i=0; i<50; i++) {
            const x = h.x - 40 + i*2;
            const y = h.y + Math.sin(i * 0.8 + simTime) * 10;
            if(i===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }
        ctx.strokeStyle = '#1abc9c';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Phase 8: 350-400ms - Inhibition
    else if (simTime < 400) {
        updateUI("Refractoriness", "SOM+ Feedback Inhibition");
        
        // SOM Interneurons Pulse Cyan
        interneurons.filter(n => n.type === 'SOM').forEach(n => {
            const center = getPos(n.region);
            // Slow strong pulse
            const sIntensity = (Math.sin(simTime * 0.5) + 1); 
            ctx.beginPath();
            ctx.arc(center.x + n.offsetX, center.y + n.offsetY, 6 * sIntensity, 0, Math.PI*2);
            ctx.fillStyle = '#00ffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        // Regions Dimming
        ['frontal', 'parietal'].forEach(k => drawRegionNode(k, 0.6)); // Dimmer
    }

    // Phase 9: 400-450ms - Alpha Rebound
    else if (simTime < 450) {
        updateUI("Decay", "Alpha Rebound (8-12Hz)");
        
        // Draw large sweep wave
        ctx.beginPath();
        for(let x=0; x<width; x+=10) {
            // Sine wave sweeping across screen
            const y = height/2 + Math.sin((x * 0.01) + (simTime * 0.1)) * 100;
            if(x===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 50;
        ctx.stroke();
    }

    // Phase 10: 450-500ms - Baseline
    else {
        updateUI("Binding Complete", "Return to Baseline (Theta)");
        // Global fade out
        // Large slow pulse
        ctx.beginPath();
        ctx.arc(width/2, height/2, width/3, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Resetting colors visually
        Object.keys(regions).forEach(k => drawRegionNode(k, 0.2));
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(animate);
}

// Start
animate();

</script>
</body>
</html>
