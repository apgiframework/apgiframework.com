<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APGI Framework — Coming Soon</title>
  <meta name="description" content="APGI Framework — a computational model of consciousness ignition, precision-gated attention, and allostatic regulation. The site is being finalized before launch." />
  <link rel="canonical" href="https://apgiframework.com/" />
  <meta property="og:title" content="APGI Framework — Coming Soon" />
  <meta property="og:description" content="A computational model of consciousness ignition, precision-gated attention, and allostatic regulation. The site is being finalized before launch." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://apgiframework.com/" />
  <meta property="og:image" content="https://apgiframework.com/assets/images/2-APGI-Framework-Diagram.png" />
  <meta property="og:site_name" content="APGI Framework" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;700&display=swap');

    :root {
      --threshold-blue: #00B4FF;
      --precision-red: #FF3366;
      --error-yellow: #FFCC00;
      --workspace-purple: #9966FF;
      --neuromod-green: #00CC99;
      --space-black: #0A0F1A;
      --dark-navy: #1A1F2E;
      --text-light: #94A3B8;
      --text-micro: #64748B;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--space-black);
      color: #FFFFFF;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 180, 255, 0.06), transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(153, 102, 255, 0.06), transparent 45%),
        var(--space-black);
    }

    main {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 40px;
      display: block;
      filter: drop-shadow(0 0 24px rgba(0, 180, 255, 0.35));
      animation: neural-pulse 3.2s ease-in-out infinite;
    }

    @keyframes neural-pulse {
      0%, 100% { filter: drop-shadow(0 0 18px rgba(0, 180, 255, 0.25)); }
      50% { filter: drop-shadow(0 0 34px rgba(0, 180, 255, 0.5)); }
    }

    .eyebrow {
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-micro);
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.25rem, 6vw, 3.25rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      margin-bottom: 20px;
    }

    p.lede {
      font-size: 1.0625rem;
      line-height: 1.65;
      color: var(--text-light);
      max-width: 480px;
      margin: 0 auto 40px;
    }

    .equation {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Crimson Pro', serif;
      font-size: 1.5rem;
      font-style: italic;
      padding: 14px 28px;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 48px;
    }

    .equation .precision { color: var(--precision-red); }
    .equation .error { color: var(--error-yellow); }
    .equation .threshold { color: var(--threshold-blue); }
    .equation .op { color: var(--text-micro); font-style: normal; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 40px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neuromod-green);
      box-shadow: 0 0 12px rgba(0, 204, 153, 0.6);
      animation: dot-pulse 2s ease-in-out infinite;
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .status-text {
      font-size: 0.875rem;
      color: var(--text-micro);
    }

    .cta {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 8px;
      background: var(--threshold-blue);
      color: #04121C;
      font-weight: 600;
      font-size: 0.9375rem;
      text-decoration: none;
      transition: box-shadow 200ms ease, transform 200ms ease;
    }

    .cta:hover {
      box-shadow: 0 0 28px rgba(0, 180, 255, 0.45);
      transform: translateY(-1px);
    }

    footer {
      margin-top: 56px;
      font-size: 0.8125rem;
      color: var(--text-micro);
    }

    footer a {
      color: var(--text-light);
      text-decoration: none;
      border-bottom: 1px solid var(--border-subtle);
    }

    footer a:hover { color: #FFFFFF; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="APGI Framework logo">
      <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
      <circle cx="16" cy="9.5" r="3.4" fill="#FF3366"/>
      <circle cx="9" cy="21" r="3.4" fill="#FFCC00"/>
      <circle cx="23" cy="21" r="3.4" fill="#00B4FF"/>
      <path d="M16 9.5 L9 21 M16 9.5 L23 21 M9 21 L23 21" stroke="#5e6ad2" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
    </svg>

    <p class="eyebrow">APGI Framework</p>
    <h1>Something is coming into focus.</h1>
    <p class="lede">
      A computational model of consciousness ignition, precision-gated attention, and allostatic regulation.
      We're finishing the site before it goes live.
    </p>

    <div class="equation" aria-label="Core APGI equation">
      <span class="precision">Π</span>
      <span class="op">×</span>
      <span class="error">|ε|</span>
      <span class="op">&gt;</span>
      <span class="threshold">B</span><sub class="threshold" style="font-size:0.7em;">t</sub>
    </div>

    <div class="status-row">
      <span class="status-dot"></span>
      <span class="status-text">In active development</span>
    </div>

    <div>
      <a class="cta" href="/contact.html">Get in touch</a>
    </div>

    <footer>
      <p>&copy; 2026 APGI Framework · <a href="/privacy-policy.html">Privacy</a> · <a href="/terms-of-service.html">Terms</a></p>
    </footer>
  </main>
</body>
</html>
