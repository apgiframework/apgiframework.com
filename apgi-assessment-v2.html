  const d = new Date(Date.now() + CONFIG.retestDays * 864e5), f = x => x.toISOString().slice(0, 10).replace(/-/g, "");
  return new Blob([["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//APGI//Assessment//EN", "BEGIN:VEVENT", `UID:${S.sessionId}@apgiframework.com`, `DTSTAMP:${f(new Date())}T000000Z`, `DTSTART;VALUE=DATE:${f(d)}`,
    "SUMMARY:Retake the APGI assessment (see what moved)", `DESCRIPTION:Retake the APGI assessment ${CONFIG.retestDays}-21 days after your first session. ${CONFIG.ids.site}/apgi-assessment-v2.html`, "END:VEVENT", "END:VCALENDAR"].join("\r\n")], { type: "text/calendar" });
}
async function showResults() {
  setModule("Results"); $("#barFill").style.width = "100%"; $("#barText").textContent = "100%";
  const F = buildFeatures(); S.results = F; const id = await sigId(F), D = F.detection, M = F.masking, C = F.compare, R = F.reversal, P = F.selfreport, Q = F.quality, V = F.validity;
  const crit = D.criterion_c == null ? "—" : D.criterion_c > 0.25 ? "cautious" : D.criterion_c < -0.25 ? "liberal" : "balanced";
  const soa = M.soa_midpoint_ms == null ? "—" : (M.soa_censored === "below" ? "≤ " : M.soa_censored === "above" ? "> " : "") + Math.round(M.soa_midpoint_ms) + " ms";
  const tierCls = Q.tier === "A" ? "ok" : Q.tier === "B" ? "mid" : "bad";
  render(`<div class="glass center" style="margin-bottom:20px"><h1 class="gradient-text" style="font-size:2.2rem">Your session signature</h1><p class="muted" style="max-width:640px;margin:0 auto">A snapshot of how you performed in <em>this</em> session. It is not a trait, a rank or a diagnosis.</p></div>
  <div class="res-grid"><div><canvas id="sigCanvas" aria-label="Radial signature of your session indices"></canvas>
    <div class="row"><button class="btn sm" id="dPng">Download signature (PNG)</button><button class="btn sm" id="dPdf">Download report (PDF)</button><button class="btn sm ghost" id="dJson">Download my data (JSON)</button><button class="btn sm ghost" id="dIcs">Add retest reminder</button></div>
    <p class="note center">Retest in ${CONFIG.retestDays}–21 days to see what moved. Until reliability is measured, small differences between sessions can't be told apart from noise.</p></div>
  <div>
    <div class="glass rcard"><h3>Faint-spot detection <span class="tag">behavioural estimate · provisional</span></h3><dl>${row("Sensitivity (d′)", f1(D.d_prime))}${row("Response criterion (c)", f1(D.criterion_c) + " · " + crit)}${row("Hit / false-alarm rate", f1(D.hit_rate, 2) + " / " + f1(D.fa_rate, 2))}${row("Contrast at ~70% detection", D.contrast_threshold == null ? "—" : (D.contrast_threshold * 100).toFixed(1) + "%" )}${row("Valid signal / catch trials", D.n_signal + " / " + D.n_catch)}</dl>
      <p class="note">d′ separates how well you discriminate from how willing you are to say "seen". The contrast figure depends on your screen's brightness and gamma, so it is not comparable across devices.${D.threshold_stable ? "" : " The staircase did not settle, so treat the contrast figure as rough."}</p></div>
    <div class="glass rcard m2"><h3>Quick arrow <span class="tag">behavioural estimate · provisional</span></h3><dl>${row("Delay for 75% correct", soa)}${row("Accuracy at 33 / 150 ms", f1(M.acc_by_soa[33], 2) + " / " + f1(M.acc_by_soa[150], 2))}${row("Transition sharpness", f1(M.transition_sharpness))}</dl>
      <p class="note">Shorter delays mean the arrow stayed reportable despite the cover pattern. Sharpness compares a step-like against a gradual rise and is exploratory at this trial count.</p></div>
    <div class="glass rcard m3"><h3>Compare and rate <span class="tag">behavioural estimate · provisional</span></h3><dl>${row("Accuracy", f1(C.accuracy, 2))}${row("Confidence sensitivity (AUROC₂)", f1(C.metacog_auroc2))}${row("Over(+)/under(−)confidence", f1(C.overconfidence))}${row("Same, from the detection task", f1(D.metacog_auroc2))}</dl>
      <p class="note">AUROC₂ is 0.5 when confidence ignores correctness and 1.0 when it separates right from wrong perfectly. With 24 trials it carries wide uncertainty.</p></div>
    <div class="glass rcard m4"><h3>Shifting rewards <span class="tag">behavioural estimate · provisional</span></h3><dl>${row("Chose the better shape", f1(R.accuracy, 2))}${row("Stay after +1 / shift after 0", f1(R.win_stay, 2) + " / " + f1(R.lose_shift, 2))}${row("Held on to old shape after a swap", f1(R.perseveration, 2))}${row("Trials to adapt to a swap", f1(R.recovery_trials, 1))}</dl>
      <p class="note">Model-free summaries only. A fitted learning-rate composite is withheld until the model passes its identifiability gate.</p></div>
    <div class="glass rcard m5"><h3>Questionnaire <span class="tag">self-report · exploratory</span></h3><dl>${row("Noticing changes (1–5)", f1(P.change_noticing))}${row("Knowing how sure you are (1–5)", f1(P.confidence_awareness))}${row("Using body signals (1–5)", f1(P.body_signal_use))}</dl>
      <p class="note">These items are still in pilot; their grouping into three scales is a hypothesis, not an established structure.</p></div>
  </div></div>
  <div class="glass" style="margin-top:20px"><h3>Session quality and how to read this</h3>
    <div class="grid g2"><dl><dt>Quality tier</dt><dd class="${tierCls}">${Q.tier}${Q.tier_reasons.length ? "" : ""}</dd>${row("Display / frame jitter", Q.hz + " Hz / p95 " + f1(Q.p95FrameMs, 1, " ms"))}${row("Tab switches", Q.tabLoss)}${row("Attention checks failed", V.attention_checks_failed)}${row("Included in reference analyses", V.exclude_from_norms ? "No" : "Yes")}</dl>
    <p class="note" style="margin:0">${Q.tier_reasons.length ? "Why not Tier A: " + Q.tier_reasons.join("; ") + ". " : "Timing and attention checks met the Tier A rules. "}Reliability of every index is <strong>not yet measured</strong> (no retest wave has run), and there is <strong>no reference group</strong> to compare you with. Nothing here says anything about health.</p></div>
    <p class="note" id="upStat">Preparing research upload…</p>
    <p class="note mono">${id} · session ${S.sessionId.slice(0, 8)} · battery ${CONFIG.battery} · features ${CONFIG.features} · model: none · reference: none · form ${S.form} · release ${CONFIG.release}</p>
    <div class="row"><button class="btn sm ghost" id="again">Start a new session</button><button class="btn sm ghost" id="wipe">Delete my data from this browser</button></div></div>`, true);
  const spokes = spokesFrom(F), cv = $("#sigCanvas"), meta = { battery: CONFIG.battery, release: CONFIG.release, tier: Q.tier, date: new Date().toISOString().slice(0, 10) }; drawSignature(cv, spokes, id, meta);
  const P_ = payload(F, id); S.done.push("results"); save();
  $("#dPng").addEventListener("click", () => cv.toBlob(b => download(`${id}.png`, b)));
  $("#dJson").addEventListener("click", () => download(`${id}.json`, new Blob([JSON.stringify(P_, null, 2)], { type: "application/json" })));
  $("#dIcs").addEventListener("click", () => download("apgi-retest.ics", icsRetest()));
  $("#dPdf").addEventListener("click", () => pdf(F, id, cv, P_));
  $("#again").addEventListener("click", () => { try { localStorage.removeItem(CONFIG.storage.progress); } catch (e) { /* */ } S = freshState(); showIntro(); });
  $("#wipe").addEventListener("click", () => { try { [CONFIG.storage.progress, CONFIG.storage.pid, CONFIG.storage.sessions, CONFIG.storage.outbox].forEach(k => localStorage.removeItem(k)); } catch (e) { /* */ } $("#wipe").textContent = "Deleted from this browser"; $("#wipe").disabled = true; });
  $("#upStat").textContent = await upload(P_);
}
function pdf(F, id, cv, P_) {
  const J = window.jspdf; if (!J) { cv.toBlob(b => download(`${id}.png`, b)); return; }
  const d = new J.jsPDF({ unit: "mm", format: "a4" }); let y = 18; const line = (t, s = 10, b = false) => { d.setFontSize(s); d.setFont("helvetica", b ? "bold" : "normal"); d.splitTextToSize(t, 176).forEach(l => { d.text(l, 17, y); y += s * 0.45; }); y += 1.5; };
  line("APGI Cognitive Processing Assessment - session report", 15, true); line(`${id}  |  ${new Date().toISOString().slice(0, 10)}  |  battery ${CONFIG.battery}  |  release state: ${CONFIG.release}`, 9);
  d.addImage(cv.toDataURL("image/png"), "PNG", 30, y, 150, 150); y += 156;
  const D = F.detection, M = F.masking, C = F.compare, R = F.reversal;
  line("Detection: d' " + f1(D.d_prime) + ", criterion c " + f1(D.criterion_c) + ", hit " + f1(D.hit_rate) + ", false alarm " + f1(D.fa_rate) + ", contrast threshold " + f1(D.contrast_threshold && D.contrast_threshold * 100, 1, "%"));
  line("Masking: delay for 75% correct " + f1(M.soa_midpoint_ms, 0, " ms") + ", transition sharpness " + f1(M.transition_sharpness));
  line("Metacognition: accuracy " + f1(C.accuracy) + ", AUROC2 " + f1(C.metacog_auroc2) + ", overconfidence " + f1(C.overconfidence));
  line("Learning: accuracy " + f1(R.accuracy) + ", win-stay " + f1(R.win_stay) + ", lose-shift " + f1(R.lose_shift) + ", perseveration " + f1(R.perseveration) + ", trials to adapt " + f1(R.recovery_trials, 1));
  line("Self-report (1-5): noticing changes " + f1(F.selfreport.change_noticing) + ", knowing certainty " + f1(F.selfreport.confidence_awareness) + ", using body signals " + f1(F.selfreport.body_signal_use));
  line(`Quality tier ${F.quality.tier}; attention checks failed ${F.validity.attention_checks_failed}; tab switches ${F.quality.tabLoss}.`);
  line("Claim boundary: behavioural estimates from one session. Reliability not yet measured; no reference group exists; no latent model parameters are reported. This is a research tool measuring individual differences in attention and perception; it is not a diagnostic or medical device.", 9);
  line(`Registration ${CONFIG.ids.registration}  |  Archive ${CONFIG.ids.archive}  |  Site ${CONFIG.ids.site}`, 8); d.save(`${id}.pdf`);
}

/* ============================ FLOW ============================ */
async function flow() {
  const steps = [["checkin", showCheckin], ["calibration", showCalibration], ["detection", runDetection], ["masking", runMasking], ["compare", runCompare], ["reversal", runReversal], ["selfreport", runSelfReport]];
  for (const [name, fn] of steps) {
    if (S.done.includes(name)) continue;
    if (name === "detection" && !S.timing) await showCalibration();
    await fn(); S.done.push(name); save();
  }
  await showResults();
}
function boot() {
  const th = (() => { try { return localStorage.getItem(CONFIG.storage.theme); } catch (e) { return null; } })() || "dark"; document.documentElement.setAttribute("data-theme", th);
  $("#themeBtn").addEventListener("click", () => { const n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem(CONFIG.storage.theme, n); } catch (e) { /* */ } });
  footer(); const saved = loadSaved();
  if (saved) {
    render(`<section class="glass center"><h2>Resume your session?</h2><p class="muted">You have an unfinished session. It restarts at the beginning of the task you were on.</p><div class="row"><button class="btn" id="res">Resume</button><button class="btn ghost" id="new">Start over</button></div></section>`);
    $("#res").addEventListener("click", () => { S = saved; S.tabLoss = S.tabLoss || 0; $("#topbar").classList.remove("hidden"); bump(0); flow(); });
    $("#new").addEventListener("click", () => { try { localStorage.removeItem(CONFIG.storage.progress); } catch (e) { /* */ } showIntro(); });
  } else showIntro();
}
boot();
</script>
